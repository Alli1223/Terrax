name: Release

# Tag a release (e.g. `git tag v1.0.0 && git push origin v1.0.0`) and this builds
# the Windows x64 game package, the standalone Windows launcher, and the Linux x64
# package, and attaches them all to the GitHub Release so they can be downloaded
# from the Releases tab. workflow_dispatch does a dry run: the packages are
# produced as downloadable Actions artifacts, but no release is published (the
# publish job only runs for tags).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      toolset:
        description: 'MSVC PlatformToolset for the Windows build'
        default: 'v143'
        type: string

permissions:
  contents: write          # create the release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64 package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive       # third_party/imgui is a submodule

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        # The project uses vcpkg manifest mode (vcpkg.json + VcpkgEnabled).
        # Integrating the preinstalled vcpkg makes MSBuild restore glfw3/glm/
        # boost-asio, add their include/lib paths, and copy dependent DLLs
        # (glfw3.dll) next to the exe automatically.
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Build Terrax (Release | x64)
        shell: pwsh
        # Terrax.vcxproj targets PlatformToolset v145 (VS 2026), which hosted
        # runners do not ship, so override to the runner's toolset. The code is
        # C++17 and builds on v143; bump this input once runners carry v145.
        env:
          TOOLSET: ${{ github.event.inputs.toolset || 'v143' }}
        run: |
          # VcpkgEnableManifest=true makes the vcpkg MSBuild integration restore
          # glfw3/glm/boost-asio from vcpkg.json into vcpkg_installed (and copy
          # glfw3.dll next to the exe). Without it, manifest mode is off on the
          # runner and the headers aren't found.
          msbuild Terrax.vcxproj `
            /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=$env:TOOLSET `
            /p:VcpkgEnableManifest=true `
            /m /v:minimal /clp:Summary
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed ($LASTEXITCODE)" }

      - name: Build Terrax Launcher (Release | x64)
        shell: pwsh
        # The launcher is its own MSBuild project (separate exe). Same toolset
        # override + vcpkg manifest restore as the game; this also copies glfw3.dll
        # next to TerraxLauncher.exe via the vcpkg applocal step.
        env:
          TOOLSET: ${{ github.event.inputs.toolset || 'v143' }}
        run: |
          msbuild TerraxLauncher.vcxproj `
            /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=$env:TOOLSET `
            /p:VcpkgEnableManifest=true `
            /m /v:minimal /clp:Summary
          if ($LASTEXITCODE -ne 0) { throw "Launcher MSBuild failed ($LASTEXITCODE)" }

      - name: Stage + zip
        shell: pwsh
        run: |
          $rel   = "build/windows/Release"
          $stage = "dist/Terrax"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel/Terrax.exe" $stage
          Copy-Item "$rel/*.dll" $stage            # glfw3.dll and any other runtime DLLs
          Copy-Item "shaders" "$stage/shaders" -Recurse
          $readme = @(
            'Terrax - Windows x64',
            '',
            'Run Terrax.exe to play. "Terrax.exe --server" runs a dedicated server (port 12345).',
            'Keep glfw3.dll and the shaders\ folder next to Terrax.exe.',
            '',
            'If the game will not start, install the Microsoft Visual C++ Redistributable:',
            'https://aka.ms/vs/17/release/vc_redist.x64.exe'
          )
          Set-Content -Path "$stage/README.txt" -Value $readme -Encoding utf8
          $ver = "${{ github.ref_name }}"
          if (-not $ver) { $ver = "dev" }
          Compress-Archive -Path "dist/Terrax/*" -DestinationPath "Terrax-$ver-win64.zip" -Force

          # --- Launcher: standalone auto-updater (downloads the game itself) ---
          $lrel   = "build/windows/Release/launcher"
          $lstage = "dist/TerraxLauncher"
          New-Item -ItemType Directory -Force -Path $lstage | Out-Null
          Copy-Item "$lrel/TerraxLauncher.exe" $lstage
          Copy-Item "$lrel/*.dll" $lstage            # glfw3.dll
          $lreadme = @(
            'Terrax Launcher - Windows x64',
            '',
            'Run TerraxLauncher.exe to install, update, and play Terrax. It downloads',
            'the latest GitHub release into %LOCALAPPDATA%\Terrax and launches it.',
            'Keep glfw3.dll next to TerraxLauncher.exe.',
            '',
            'If it will not start, install the Microsoft Visual C++ Redistributable:',
            'https://aka.ms/vs/17/release/vc_redist.x64.exe'
          )
          Set-Content -Path "$lstage/README.txt" -Value $lreadme -Encoding utf8
          Compress-Archive -Path "dist/TerraxLauncher/*" -DestinationPath "TerraxLauncher-$ver-win64.zip" -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            Terrax-*-win64.zip
            TerraxLauncher-*-win64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  linux:
    name: Linux x64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive       # third_party/imgui is a submodule

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make libglm-dev libglfw3-dev libgl1-mesa-dev libboost-dev

      - name: Build (make)
        run: make -j"$(nproc)"

      - name: Stage + tar.gz
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          stage="dist/Terrax"
          mkdir -p "$stage"
          cp terrax "$stage/"
          chmod +x "$stage/terrax"
          cp -r shaders "$stage/"
          printf '%s\n' \
            'Terrax - Linux x64' \
            '' \
            'Run ./terrax to play. "./terrax --server" runs a dedicated server (port 12345).' \
            'Keep the shaders/ folder next to the binary.' \
            '' \
            'Requires an OpenGL driver and GLFW at runtime. On Debian/Ubuntu:' \
            '  sudo apt install libglfw3' \
            > "$stage/README.txt"
          tar -czf "Terrax-$ver-linux-x64.tar.gz" -C dist Terrax

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux
          path: Terrax-*-linux-x64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true       # flatten both artifacts into dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          # SemVer pre-release tags carry a hyphen (v0.1.0-rc.1); mark those as
          # prereleases so a plain vX.Y.Z stays the "Latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}
